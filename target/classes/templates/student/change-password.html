<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/portal :: head('Change password')}"></head>
<body class="portal-body"><div class="portal-layout">
    <aside th:replace="~{fragments/portal :: studentSidebar(${activePage})}"></aside>
    <main class="portal-main">
        <header th:replace="~{fragments/portal :: topbar('Change password', 'STUDENT PORTAL')}"></header>
        <div class="portal-content">
            <div class="page-heading"><div><div class="section-label">SECURITY</div><h1>Change password</h1><p>Use a strong password you do not use elsewhere.</p></div></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <section class="portal-card" style="max-width:600px">
                <form th:action="@{/student/change-password}" th:object="${passwordForm}" method="post">
                    <div class="form-group"><label class="form-label" for="currentPassword">Current password</label><input id="currentPassword" type="password" th:field="*{currentPassword}" class="form-control no-icon" autocomplete="current-password" required></div>
                    <div class="form-group"><label class="form-label" for="newPassword">New password</label><input id="newPassword" type="password" th:field="*{newPassword}" class="form-control no-icon" minlength="8" autocomplete="new-password" required></div>
                    <div class="form-group"><label class="form-label" for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control no-icon" minlength="8" autocomplete="new-password" required></div>
                    <button class="btn btn-primary" type="submit">Update password</button>
                </form>
            </section>
        </div>
    </main>
</div></body></html>
