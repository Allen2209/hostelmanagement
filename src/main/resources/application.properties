spring.application.name=hostel-management-system
server.port=8080

# Set DB_USERNAME and DB_PASSWORD in your environment for local MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostel_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
