<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/portal :: head('Available rooms')}"></head>
<body class="portal-body">
<div class="portal-layout">
    <aside th:replace="~{fragments/portal :: studentSidebar(${activePage})}"></aside>
    <main class="portal-main">
        <header th:replace="~{fragments/portal :: topbar('Available rooms', 'STUDENT PORTAL')}"></header>
        <div class="portal-content">
            <div class="page-heading">
                <div><div class="section-label">ROOM DIRECTORY</div><h1>Available rooms</h1><p>Find a room that suits your campus living needs.</p></div>
            </div>
            <section class="portal-card">
                <div class="data-table-wrap">
                    <table class="portal-table">
                        <thead><tr><th>Room</th><th>Hostel</th><th>Room type</th><th>Capacity</th><th>Occupied</th><th>Available</th><th>Action</th></tr></thead>
                        <tbody>
                        <tr th:each="room : ${rooms}">
                            <td><strong th:text="${room.roomNumber}">101</strong></td>
                            <td th:text="${room.hostel.name}">A Block</td>
                            <td th:text="${room.roomType}">4 Sharing</td>
                            <td th:text="${room.capacity}">4</td>
                            <td th:text="${room.occupied}">2</td>
                            <td><span class="status-badge" th:text="${room.availableBeds}">2 beds</span></td>
                            <td>
                                <form th:action="@{/student/room-request}" method="post" class="compact-action">
                                    <input type="hidden" name="roomId" th:value="${room.id}">
                                    <input type="text" name="reason" class="form-control no-icon compact-input" placeholder="Optional note" maxlength="500" aria-label="Optional request reason">
                                    <button type="submit" class="btn btn-primary btn-small">Request</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rooms)}"><td colspan="7" class="table-empty">No available rooms at this time.</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
