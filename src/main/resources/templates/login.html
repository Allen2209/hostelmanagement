<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · HostelHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="navbar">
    <a th:href="@{/login}" class="brand"><span class="portal-brand-mark">H</span><span>HostelHub</span></a>
    <nav class="nav-links"><a th:href="@{/login}" class="nav-link active">Sign in</a><a th:href="@{/register}" class="nav-link">Create account</a></nav>
</header>
<main class="main-content">
    <div class="container-center">
        <section class="card">
            <div class="card-header">
                <h1>Welcome back</h1>
                <p>Sign in to manage your hostel life</p>
            </div>
            <div th:if="${logoutMessage}" class="alert alert-info" th:text="${logoutMessage}"></div>
            <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Student ID or username <span class="req">*</span></label>
                    <input id="username" name="username" class="form-control no-icon" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password <span class="req">*</span></label>
                    <input id="password" name="password" type="password" class="form-control no-icon" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem">Sign in to HostelHub</button>
            </form>
            <div class="form-footer">New student? <a th:href="@{/register}">Create your account</a></div>
            <div class="notice-card" style="margin-top:1rem"><div><strong>Demo access</strong>Admin: admin / admin123 · Student: student / student123</div></div>
        </section>
    </div>
</main>
<footer class="app-footer">HostelHub · College Hostel Management</footer>
</body>
</html>
